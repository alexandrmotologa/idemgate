<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="badge-clip">
      <rect x="0" y="0" width="200" height="200" rx="42"/>
    </clipPath>
  </defs>

  <!-- Clean Rounded Square Badge -->
  <rect x="0" y="0" width="200" height="200" rx="42" fill="#ffffff"/>

  <g clip-path="url(#badge-clip)">
    <!-- Gateway Portal / Hexagon Frame -->
    <polygon points="100,14 182,58 182,142 100,186 18,142 18,58" 
             fill="none" stroke="#18181b" stroke-width="11" stroke-linejoin="round"/>
    
    <!-- Elephant Silhouette -->
    <path d="
        M 100,34 
        C 118,34 130,42 134,54 
        C 152,48 170,60 168,88 
        C 166,110 148,124 132,118 
        L 132,102 
        C 128,110 122,116 116,120
        L 116,150
        C 116,164 108,170 100,170
        C 92,170 84,164 84,150
        L 84,120
        C 78,116 72,110 68,102
        L 68,118
        C 52,124 34,110 32,88
        C 30,60 48,48 66,54
        C 70,42 82,34 100,34 Z
    " fill="#18181b"/>

    <!-- Inner Ear Cyan Accents (Gateway Portals) -->
    <path d="M 64,62 C 48,60 42,74 44,92 C 46,104 56,110 68,106 Z" fill="#0ea5e9"/>
    <path d="M 136,62 C 152,60 158,74 156,92 C 154,104 144,110 132,106 Z" fill="#0ea5e9"/>

    <!-- Brow Identity Bars (== Idempotency Equality) -->
    <rect x="88" y="52" width="24" height="4.5" rx="2.25" fill="#38bdf8"/>
    <rect x="88" y="61" width="24" height="4.5" rx="2.25" fill="#38bdf8"/>

    <!-- Sleek Curved Tusks (Gate Pillars) -->
    <path d="M 76,110 C 64,124 62,140 76,146 C 80,138 82,124 82,112 Z" fill="#38bdf8"/>
    <path d="M 124,110 C 136,124 138,140 124,146 C 120,138 118,124 118,112 Z" fill="#38bdf8"/>

    <!-- Focused Minimalist Eyes -->
    <circle cx="82" cy="84" r="4" fill="#ffffff"/>
    <circle cx="82.5" cy="84" r="2" fill="#18181b"/>
    <circle cx="118" cy="84" r="4" fill="#ffffff"/>
    <circle cx="117.5" cy="84" r="2" fill="#18181b"/>

    <!-- Keyhole Portal Cutout in Trunk (Idempotency Key) -->
    <circle cx="100" cy="136" r="5" fill="#ffffff"/>
    <polygon points="97,138 103,138 105,154 95,154" fill="#ffffff"/>
  </g>
</svg>
