services:
  redis:
    image: redis:7-alpine
    container_name: idemgate-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  idemgate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idemgate-proxy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - IDEMGATE_STORAGE_TYPE=redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - IDEMGATE_UPSTREAM_URL=http://localhost:8080/upstream-mock
      - IDEMGATE_RATE_LIMIT_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
